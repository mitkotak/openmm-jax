name: Publish PyPI Wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Where to publish built wheels"
        required: true
        default: none
        type: choice
        options:
          - testpypi
          - none
  release:
    types:
      - published

jobs:
  build-wheels:
    name: Python ${{ matrix.python }} CUDA ${{ matrix.cuda.major }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.12"
        cuda:
          - major: "12"
            cuda_version: "12.9"
            package: openmmjax-cu12
          - major: "13"
            cuda_version: "13.0"
            package: openmmjax-cu13

    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        if: github.event_name == 'release'
        run: |
          version="$(sed -n 's/^SET(OPENMM_JAX_VERSION \([^ )]*\).*/\1/p' CMakeLists.txt)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "${version}" != "${tag}" ]]; then
            echo "CMake OPENMM_JAX_VERSION (${version}) does not match release tag (${GITHUB_REF_NAME})."
            exit 1
          fi

      - uses: conda-incubator/setup-miniconda@v4
        name: Install build environment
        with:
          activate-environment: build
          miniforge-variant: Miniforge3
          use-mamba: true
          channels: conda-forge
          channel-priority: strict
          python-version: ${{ matrix.python }}

      - name: Install build dependencies
        run: |
          mamba install -y \
            python=${{ matrix.python }} \
            pip \
            setuptools \
            wheel \
            "cmake>=3.22" \
            make \
            cxx-compiler \
            swig=4.3.1 \
            auditwheel \
            patchelf \
            cuda-version=${{ matrix.cuda.cuda_version }} \
            cuda-cudart-dev \
            cuda-driver-dev \
            cuda-crt \
            cuda-nvcc \
            openmm=8.5.2 \
            numpy

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${CONDA_PREFIX}" \
            -DOPENMM_DIR="${CONDA_PREFIX}"

      - name: Build native libraries and Python wrapper
        run: |
          cmake --build build --target OpenMMJax --parallel 2
          cmake --build build --target OpenMMJaxCUDA --parallel 2
          cmake --build build --target PythonWrapper --parallel 2

      - name: Build wheel
        env:
          OPENMM_JAX_PACKAGE_NAME: ${{ matrix.cuda.package }}
          OPENMM_JAX_CUDA_VERSION: ${{ matrix.cuda.major }}
        run: |
          devtools/build-wheel.sh

      - name: Smoke test wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import openmmjax; print(openmmjax.JaxForce)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cuda.package }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-22.04
    if: github.event_name == 'release'
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: astral-sh/setup-uv@v5

      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish dist/*.whl

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build-wheels
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: astral-sh/setup-uv@v5

      - name: Publish to TestPyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: uv publish --publish-url https://test.pypi.org/legacy/ dist/*.whl
